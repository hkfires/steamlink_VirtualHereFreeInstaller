name: Build and Release

on:
  push:
    tags:
      - '*'
  workflow_dispatch:

jobs:
  build:
    name: Build Steam Link Package
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkout Steam Link SDK
        uses: actions/checkout@v4
        with:
          repository: ValveSoftware/steamlink-sdk
          path: steamlink-sdk
          fetch-depth: 1

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libmpfr-dev libmpfr6
          # Create compatibility symlink for libmpfr.so.4 if needed by the cross-compiler
          if [ ! -f /usr/lib/x86_64-linux-gnu/libmpfr.so.4 ] && [ -f /usr/lib/x86_64-linux-gnu/libmpfr.so.6 ]; then
            sudo ln -sf /usr/lib/x86_64-linux-gnu/libmpfr.so.6 /usr/lib/x86_64-linux-gnu/libmpfr.so.4
          fi

      - name: Build VirtualHereFree Installer
        run: |
          export MARVELL_SDK_PATH="$GITHUB_WORKSPACE/steamlink-sdk"
          export LD_LIBRARY_PATH="$MARVELL_SDK_PATH/toolchain/lib:$LD_LIBRARY_PATH"
          chmod +x ./build_steamlink.sh
          ./build_steamlink.sh

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VirtualHereFreeInstaller
          path: steamlink/apps/VirtualHereFreeInstaller.tgz
          if-no-files-found: error

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: steamlink/apps/VirtualHereFreeInstaller.tgz
          generate_release_notes: true
